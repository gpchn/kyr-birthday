<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf4">
<meta name="description" content="孔樱燃，十八岁生日快乐。">
<title>孔樱燃 · 十八岁生日快乐</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#wish">跳到许愿</a>

<canvas id="petals" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="ambient" aria-hidden="true">
  <span class="ambient__orb ambient__orb--1"></span>
  <span class="ambient__orb ambient__orb--2"></span>
  <span class="ambient__orb ambient__orb--3"></span>
</div>

<audio id="bgm" src="bgm.mp3" loop autoplay preload="auto" playsinline webkit-playsinline></audio>
<button class="sound" id="soundBtn" type="button" aria-label="播放生日歌" aria-pressed="false">
  <svg class="sound__icon sound__icon--on" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/>
    <path d="M15.2 8.7a4.7 4.7 0 0 1 0 6.6"/>
    <path d="M17.8 6.1a8.3 8.3 0 0 1 0 11.8"/>
  </svg>
  <svg class="sound__icon sound__icon--off" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/>
    <path d="M15.6 9.6l5 4.8M20.6 9.6l-5 4.8"/>
  </svg>
</button>

<!-- 共享的樱花 / 樱桃图形 -->
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <g id="blossom">
      <g fill="#f3b7c5">
        <ellipse cx="0" cy="-7.2" rx="4.6" ry="7.2"/>
        <ellipse cx="0" cy="-7.2" rx="4.6" ry="7.2" transform="rotate(72)"/>
        <ellipse cx="0" cy="-7.2" rx="4.6" ry="7.2" transform="rotate(144)"/>
        <ellipse cx="0" cy="-7.2" rx="4.6" ry="7.2" transform="rotate(216)"/>
        <ellipse cx="0" cy="-7.2" rx="4.6" ry="7.2" transform="rotate(288)"/>
      </g>
      <circle r="3" fill="#e79caf"/>
      <circle r="1.2" fill="#c16076"/>
      <g stroke="#d48295" stroke-width=".6" stroke-linecap="round" opacity=".8">
        <line x1="0" y1="-2.6" x2="0" y2="-4.4"/>
        <line x1="2.2" y1="1.4" x2="3.6" y2="2.4"/>
        <line x1="-2.2" y1="1.4" x2="-3.6" y2="2.4"/>
      </g>
    </g>

    <g id="cherry">
      <path d="M0 -15C1.5 -9 3.5 -5 8 -1.5M0 -15C-1.5 -9 -3.5 -5 -8 -2.5" fill="none" stroke="#907053" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M-1 -15C3 -20 9.5 -20.5 13.5 -16.5C9.5 -12 3 -12.5 -1 -15Z" fill="#94a972"/>
      <circle cx="8.5" cy="3" r="6.2" fill="#d1586f"/>
      <circle cx="-8.5" cy="4.5" r="6.2" fill="#c44a62"/>
      <ellipse cx="6.3" cy="1" rx="1.5" ry="2.3" fill="#fbd3db" opacity=".7" transform="rotate(18 6.3 1)"/>
      <ellipse cx="-10.4" cy="2.6" rx="1.2" ry="1.9" fill="#fbd3db" opacity=".45" transform="rotate(18 -10.4 2.6)"/>
    </g>

    <symbol id="branch" viewBox="0 0 280 220">
      <g fill="none" stroke="#a07d60" stroke-linecap="round">
        <path d="M4 18C52 28 92 44 118 68c20 18 42 32 76 38" stroke-width="1.8"/>
        <path d="M70 34C90 27 108 18 124 5" stroke-width="1.2"/>
        <path d="M120 70C130 60 138 50 141 37" stroke-width="1"/>
        <path d="M150 88C158 82 166 78 176 76" stroke-width=".9"/>
      </g>
      <g fill="#aab78b" opacity=".8">
        <path d="M58 28c4-4 11-4 14 1-4 4-10 4-14-1Z" transform="rotate(-18 65 29)"/>
        <path d="M106 58c4-4 11-4 14 1-4 4-10 4-14-1Z" transform="rotate(24 113 59)"/>
        <path d="M174 102c4-4 11-4 14 1-4 4-10 4-14-1Z" transform="rotate(-12 181 103)"/>
      </g>
      <use href="#blossom" transform="translate(46 28) scale(1.05) rotate(-8)"/>
      <use href="#blossom" transform="translate(83 47) scale(.75) rotate(14)"/>
      <use href="#blossom" transform="translate(114 68) scale(1.2) rotate(-2)"/>
      <use href="#blossom" transform="translate(148 92) scale(.85) rotate(18)"/>
      <use href="#blossom" transform="translate(124 8) scale(.6) rotate(-20)"/>
      <use href="#blossom" transform="translate(184 84) scale(.6) rotate(8)"/>
      <circle cx="107" cy="80" r="2.2" fill="#eaa9b8"/>
      <circle cx="137" cy="52" r="1.8" fill="#eaa9b8"/>
      <use href="#cherry" transform="translate(170 112) scale(.85) rotate(6)"/>
    </symbol>
  </defs>
</svg>

<main id="main">

  <!-- 封面 -->
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero__frame">
      <svg class="hero__branch hero__branch--left" viewBox="0 0 280 220" aria-hidden="true"><use href="#branch"/></svg>
      <svg class="hero__branch hero__branch--right" viewBox="0 0 280 220" aria-hidden="true"><use href="#branch"/></svg>

      <div class="hero__content">
        <p class="hero__age" aria-hidden="true">18</p>
        <h1 class="hero__name" id="hero-title">孔樱燃</h1>
        <p class="hero__sub">生日快乐</p>
        <span class="hero__rule" aria-hidden="true">
          <i></i>
          <svg viewBox="-12 -12 24 24"><use href="#blossom"/></svg>
          <i></i>
        </span>
        <p class="hero__line">樱桃熟时，恰逢你十八岁</p>
      </div>

      <a class="hero__cue" href="#wish" aria-label="向下浏览，许个愿">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v13M6.5 12.5 12 18l5.5-5.5"/>
        </svg>
      </a>
    </div>
  </section>

  <!-- 许愿 -->
  <section class="wish section" id="wish" aria-labelledby="wish-title">
    <div class="wrap">
      <header class="sec-head reveal">
        <h2 id="wish-title">对着十八岁，许个愿</h2>
        <span class="sec-head__rule" aria-hidden="true"></span>
      </header>

      <div class="cake-stage" id="cakeStage">
        <span class="cake-stage__halo" aria-hidden="true"></span>
        <svg class="cake-sprig cake-sprig--left" viewBox="-20 -22 40 40" aria-hidden="true"><use href="#cherry"/></svg>
        <svg class="cake-sprig cake-sprig--right" viewBox="-20 -22 40 40" aria-hidden="true"><use href="#cherry"/></svg>

        <svg class="cake" id="cake" viewBox="0 0 320 316" role="img" aria-labelledby="cakeTitle">
          <title id="cakeTitle">生日蛋糕，轻触蜡烛可以吹灭</title>
          <defs>
            <linearGradient id="gTierTop" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fbe6ec"/>
              <stop offset="1" stop-color="#f3ceda"/>
            </linearGradient>
            <linearGradient id="gTierBottom" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff8f0"/>
              <stop offset="1" stop-color="#f6e2d6"/>
            </linearGradient>
            <linearGradient id="gIcing" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fffdf9"/>
              <stop offset="1" stop-color="#fdf1e6"/>
            </linearGradient>
            <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#f2a340"/>
              <stop offset=".55" stop-color="#ffca63"/>
              <stop offset="1" stop-color="#fff3c4"/>
            </linearGradient>
            <radialGradient id="gFlameGlow" cx=".5" cy=".55" r=".55">
              <stop offset="0" stop-color="#ffd97a" stop-opacity=".75"/>
              <stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
            </radialGradient>
            <pattern id="pStripe" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
              <rect width="8" height="8" fill="#fff9f2"/>
              <rect width="4" height="8" fill="#eaa3b4"/>
            </pattern>
          </defs>

          <ellipse cx="160" cy="286" rx="124" ry="13" fill="#c98c95" opacity=".16"/>
          <ellipse cx="160" cy="274" rx="126" ry="17" fill="#fffdf8" stroke="#d9bd8f" stroke-opacity=".55"/>
          <ellipse cx="160" cy="271" rx="104" ry="11" fill="#f7e9df"/>

          <!-- 下层蛋糕 -->
          <rect x="50" y="198" width="220" height="72" rx="18" fill="url(#gTierBottom)"/>
          <g fill="url(#gIcing)">
            <rect x="50" y="188" width="220" height="34" rx="17"/>
            <circle cx="62" cy="218" r="8"/>
            <circle cx="86" cy="220" r="7.2"/>
            <circle cx="110" cy="221" r="7.6"/>
            <circle cx="134" cy="220" r="7.2"/>
            <circle cx="158" cy="221" r="7.6"/>
            <circle cx="182" cy="220" r="7.2"/>
            <circle cx="206" cy="221" r="7.6"/>
            <circle cx="230" cy="220" r="7.2"/>
            <circle cx="254" cy="218" r="8"/>
          </g>
          <g fill="#d9b576" opacity=".9">
            <circle cx="76" cy="244" r="1.6"/>
            <circle cx="104" cy="244" r="1.6"/>
            <circle cx="132" cy="244" r="1.6"/>
            <circle cx="160" cy="244" r="1.6"/>
            <circle cx="188" cy="244" r="1.6"/>
            <circle cx="216" cy="244" r="1.6"/>
            <circle cx="244" cy="244" r="1.6"/>
          </g>

          <!-- 上层蛋糕 -->
          <rect x="88" y="138" width="144" height="64" rx="16" fill="url(#gTierTop)"/>
          <g fill="url(#gIcing)">
            <rect x="88" y="128" width="144" height="26" rx="13"/>
            <circle cx="98" cy="152" r="6.4"/>
            <circle cx="114" cy="153" r="5.8"/>
            <circle cx="130" cy="152" r="6.4"/>
            <circle cx="146" cy="153" r="5.8"/>
            <circle cx="162" cy="152" r="6.4"/>
            <circle cx="178" cy="153" r="5.8"/>
            <circle cx="194" cy="152" r="6.4"/>
            <circle cx="210" cy="153" r="5.8"/>
            <circle cx="226" cy="152" r="6.4"/>
          </g>
          <g fill="#d9b576" opacity=".9">
            <circle cx="110" cy="182" r="1.5"/>
            <circle cx="132" cy="182" r="1.5"/>
            <circle cx="154" cy="182" r="1.5"/>
            <circle cx="176" cy="182" r="1.5"/>
            <circle cx="198" cy="182" r="1.5"/>
            <circle cx="220" cy="182" r="1.5"/>
          </g>

          <use href="#cherry" transform="translate(98 116) scale(.72) rotate(-8)"/>
          <use href="#cherry" transform="translate(222 116) scale(.72) rotate(8)"/>

          <!-- 三根蜡烛 -->
          <g class="candle" role="button" tabindex="0" aria-label="左边的蜡烛，点击吹灭">
            <rect class="candle__hit" x="113" y="60" width="30" height="76" fill="transparent"/>
            <g transform="translate(128 0)">
              <ellipse cx="0" cy="128" rx="7" ry="2.2" fill="#e4b6be" opacity=".5"/>
              <rect x="-4.5" y="92" width="9" height="36" rx="4.5" fill="url(#pStripe)"/>
              <line x1="0" y1="92" x2="0" y2="86" stroke="#7c5a45" stroke-width="1.6" stroke-linecap="round"/>
              <g transform="translate(0 88)">
                <g class="flame">
                  <circle cx="0" cy="-6" r="13" fill="url(#gFlameGlow)"/>
                  <path d="M0 0C-5-5-4.5-11 0-18C4.5-11 5-5 0 0Z" fill="url(#gFlame)"/>
                  <path d="M0-2C-2.4-5-2.1-8.5 0-12C2.1-8.5 2.4-5 0-2Z" fill="#fff8d8"/>
                </g>
              </g>
              <g transform="translate(0 86)">
                <g class="smoke">
                  <circle cx="0" cy="-2" r="2" fill="#b9a7a4"/>
                  <circle cx="3.4" cy="-9" r="2.7" fill="#cbbab6" opacity=".8"/>
                  <circle cx="-2.4" cy="-16" r="3.4" fill="#d8cac6" opacity=".55"/>
                </g>
              </g>
            </g>
          </g>

          <g class="candle" role="button" tabindex="0" aria-label="中间的蜡烛，点击吹灭">
            <rect class="candle__hit" x="145" y="60" width="30" height="76" fill="transparent"/>
            <g transform="translate(160 0)">
              <ellipse cx="0" cy="128" rx="7" ry="2.2" fill="#e4b6be" opacity=".5"/>
              <rect x="-4.5" y="92" width="9" height="36" rx="4.5" fill="url(#pStripe)"/>
              <line x1="0" y1="92" x2="0" y2="86" stroke="#7c5a45" stroke-width="1.6" stroke-linecap="round"/>
              <g transform="translate(0 88)">
                <g class="flame">
                  <circle cx="0" cy="-6" r="13" fill="url(#gFlameGlow)"/>
                  <path d="M0 0C-5-5-4.5-11 0-18C4.5-11 5-5 0 0Z" fill="url(#gFlame)"/>
                  <path d="M0-2C-2.4-5-2.1-8.5 0-12C2.1-8.5 2.4-5 0-2Z" fill="#fff8d8"/>
                </g>
              </g>
              <g transform="translate(0 86)">
                <g class="smoke">
                  <circle cx="0" cy="-2" r="2" fill="#b9a7a4"/>
                  <circle cx="3.4" cy="-9" r="2.7" fill="#cbbab6" opacity=".8"/>
                  <circle cx="-2.4" cy="-16" r="3.4" fill="#d8cac6" opacity=".55"/>
                </g>
              </g>
            </g>
          </g>

          <g class="candle" role="button" tabindex="0" aria-label="右边的蜡烛，点击吹灭">
            <rect class="candle__hit" x="177" y="60" width="30" height="76" fill="transparent"/>
            <g transform="translate(192 0)">
              <ellipse cx="0" cy="128" rx="7" ry="2.2" fill="#e4b6be" opacity=".5"/>
              <rect x="-4.5" y="92" width="9" height="36" rx="4.5" fill="url(#pStripe)"/>
              <line x1="0" y1="92" x2="0" y2="86" stroke="#7c5a45" stroke-width="1.6" stroke-linecap="round"/>
              <g transform="translate(0 88)">
                <g class="flame">
                  <circle cx="0" cy="-6" r="13" fill="url(#gFlameGlow)"/>
                  <path d="M0 0C-5-5-4.5-11 0-18C4.5-11 5-5 0 0Z" fill="url(#gFlame)"/>
                  <path d="M0-2C-2.4-5-2.1-8.5 0-12C2.1-8.5 2.4-5 0-2Z" fill="#fff8d8"/>
                </g>
              </g>
              <g transform="translate(0 86)">
                <g class="smoke">
                  <circle cx="0" cy="-2" r="2" fill="#b9a7a4"/>
                  <circle cx="3.4" cy="-9" r="2.7" fill="#cbbab6" opacity=".8"/>
                  <circle cx="-2.4" cy="-16" r="3.4" fill="#d8cac6" opacity=".55"/>
                </g>
              </g>
            </g>
          </g>
        </svg>
      </div>

      <div class="wish-actions">
        <button class="blow" id="blowBtn" type="button">
          <span class="blow__dot" aria-hidden="true"></span>
          轻触蜡烛，许个愿
        </button>

        <div class="wish-result" id="wishResult" role="status" aria-live="polite" hidden>
          <svg class="wish-result__icon" viewBox="-12 -12 24 24" aria-hidden="true"><use href="#blossom"/></svg>
          <h3>愿望已寄出</h3>
          <p class="wish-result__text">愿你所愿，皆能实现。</p>
          <button class="wish-result__again" id="relightBtn" type="button">再许一次</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 信 -->
  <section class="letter-section section" aria-labelledby="letter-title">
    <div class="wrap">
      <header class="sec-head reveal">
        <h2 id="letter-title">写给你的话</h2>
        <span class="sec-head__rule" aria-hidden="true"></span>
      </header>

      <article class="letter reveal">
        <span class="letter__tape" aria-hidden="true"></span>
        <svg class="letter__mark" viewBox="-18 -24 36 38" aria-hidden="true"><use href="#cherry"/></svg>

        <p class="letter__hello">孔樱燃同学：</p>

        <p>生日快乐！恭喜你，从今天起正式成为「十八岁的大人」。</p>

        <p>愿你有做选择的勇气，也有承担结果的底气；想去的远方都能抵达，想做的事情都有回响。</p>

        <p>也愿你按时吃饭，好好睡觉；考试顺利，天天开心。同班一场，愿你记得那些平凡的好时光。</p>

        <p>十八岁，一切才刚刚开始。生日快乐，小樱桃！</p>

        <footer class="letter__sign">
          <p class="letter__signature">—— 胖虎</p>
        </footer>
      </article>
    </div>
  </section>

  <!-- 结尾 · 名字里的祝福 -->
  <section class="finale" aria-labelledby="finale-title">
    <svg class="finale__deco finale__deco--a" viewBox="-20 -22 40 40" aria-hidden="true"><use href="#cherry"/></svg>
    <svg class="finale__deco finale__deco--b" viewBox="-12 -12 24 24" aria-hidden="true"><use href="#blossom"/></svg>
    <svg class="finale__deco finale__deco--c" viewBox="-12 -12 24 24" aria-hidden="true"><use href="#blossom"/></svg>

    <div class="finale__inner">
      <svg class="finale__mark reveal" viewBox="-18 -24 36 38" aria-hidden="true"><use href="#cherry"/></svg>

      <h2 class="finale__phrase reveal" id="finale-title">
        <span class="finale__line">「<em>樱</em>」为有你</span>
        <span class="finale__line">「<em>燃</em>」得发光</span>
      </h2>

      <p class="finale__caption reveal">愿你有樱花的温柔，也有燃烧的勇敢。</p>

      <span class="finale__divider reveal" aria-hidden="true"></span>

      <p class="finale__wish reveal">生日快乐，孔樱燃同学。</p>

      <div class="finale__sign reveal">
        <strong class="finale__sign-name">胖虎</strong>
        <svg class="seal" viewBox="0 0 100 100" role="img" aria-label="十八岁生日印章">
          <defs>
            <path id="sealArc" d="M50 50m-34 0a34 34 0 1 1 68 0a34 34 0 1 1 -68 0"/>
          </defs>
          <circle cx="50" cy="50" r="47" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width=".6" stroke-dasharray="1.5 3"/>
          <text class="seal__arc" fill="currentColor" font-size="7.4" letter-spacing="2.2">
            <textPath href="#sealArc" startOffset="50%" text-anchor="middle">HAPPY 18TH BIRTHDAY</textPath>
          </text>
          <text x="50" y="55" text-anchor="middle" fill="currentColor" font-size="21" font-family="Songti SC, STSong, serif" letter-spacing="1">十八</text>
          <text x="50" y="66" text-anchor="middle" fill="currentColor" font-size="6.6" letter-spacing="2">生日快乐</text>
        </svg>
      </div>
    </div>
  </section>

</main>

<script src="js/script.js"></script>
</body>
</html>
